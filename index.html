<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f141b">
<title>Hollowmere</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ui/ui.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="brand"><i class="logo"></i><b id="town-name">Hollowmere</b></div>
    <div id="clock"><span id="date">&nbsp;</span><span id="time"></span><span id="wx"></span></div>
    <div id="popcount"></div>
    <div id="speed" role="group" aria-label="Simulation speed"></div>
    <button id="jump" title="Run until something notable happens (N)">Next event <i>&#9197;</i></button>
  </header>
  <main id="layout">
    <section id="map-wrap">
      <canvas id="map" aria-label="Town map"></canvas>
      <div id="ticker" hidden></div>
      <div id="bcard" hidden></div>
      <div id="hud">
        <button id="z-in" aria-label="Zoom in">+</button>
        <button id="z-out" aria-label="Zoom out">&minus;</button>
        <button id="z-fit" aria-label="Fit town" title="Fit town (0)">&#8962;</button>
        <button id="z-follow" aria-label="Follow selected person" title="Follow (F)" hidden>&#9678;</button>
      </div>
      <div id="map-hint">drag to pan &middot; scroll or pinch to zoom &middot; click a person</div>
      <div id="loading"><div class="spin"></div><span>Waking the town&hellip;</span></div>
    </section>
    <aside id="sidebar"></aside>
  </main>
</div>
<script type="module" src="ui/main.js"></script>
</body>
</html>
