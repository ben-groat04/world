<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hollowmere UI test</title>
<link rel="stylesheet" href="../ui/ui.css">
<style>
 html,body{margin:0;height:100%;background:#14181d;color:#e6e8ea;font:13px system-ui}
 body{display:grid;grid-template-rows:44px 1fr;height:100vh;height:100dvh}
 #top{display:flex;align-items:center;gap:10px;padding:0 12px;background:#1d232b;border-bottom:1px solid #313b47;overflow-x:auto;white-space:nowrap}
 #top b{color:#e0b04a} #top button{background:#252d37;color:#e6e8ea;border:1px solid #313b47;border-radius:6px;padding:6px 10px}
 #top button.on{background:#e0b04a;color:#111}
 #main{display:grid;grid-template-columns:1fr 400px;min-height:0}
 #map-wrap{position:relative;min-width:0;background:#0d1013} #map{width:100%;height:100%;display:block}
 #side{min-height:0}
 @media (max-width:760px){#main{grid-template-columns:1fr}#side{display:contents}}
</style></head>
<body>
<div id="top"><b id="town">Hollowmere</b><span id="clock"></span><span id="pop"></span><span style="flex:1"></span><span id="speeds"></span></div>
<div id="main"><div id="map-wrap"><canvas id="map"></canvas></div><aside id="side"></aside></div>
<script type="module">
import { createWorkerSource, createLocalSource, TIERS } from '../ui/worker.js';
import { mountDock, mountTimelapse } from '../ui/panels.js';
const qs = new URLSearchParams(location.search);
let store;
if (qs.get('local')) { const { World } = await import('../sim/world.js'); const w = new World({ seed: 1, population: +(qs.get('pop') || 120) }); store = createLocalSource(w, { drive: true }); store.setSpeed = (t) => { store.state.speed = t; store.backend.host.setTier(t); }; }
else store = createWorkerSource(new URL('../ui/worker.js', import.meta.url), { seed: +(qs.get('seed') || 1), population: +(qs.get('pop') || 150) });
window.store = store;
const dock = mountDock(document.getElementById('side'), store, { initial: qs.get('tab') || 'gazette' });
const tl = mountTimelapse(document.getElementById('map-wrap'), store);
window.dock = dock; window.tl = tl;
const sp = document.getElementById('speeds');
sp.innerHTML = TIERS.map((t) => `<button data-t="${t.id}">${t.label}</button>`).join('');
sp.onclick = (e) => { const b = e.target.closest('button'); if (b) store.setSpeed(b.dataset.t); };
store.on('speed', (t) => sp.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.t === t)));
store.on('time', (t) => { clock.textContent = t.date + ' ' + t.clock; pop.textContent = 'Pop ' + t.pop; });
store.on('ready', () => { town.textContent = store.state.townName; });
// crude map: dots
const cv = document.getElementById('map'), g = cv.getContext('2d');
function draw() { const w = cv.clientWidth, h = cv.clientHeight; cv.width = w; cv.height = h; g.fillStyle = '#2a3a2a'; g.fillRect(0, 0, w, h); const s = Math.min(w / 120, h / 90); const P = store.state.people; for (let i = 0; i < P.length; i += 6) { if (P[i + 3] & 1) continue; g.fillStyle = P[i] === store.state.selectedId ? '#fff' : (P[i + 3] & 2 ? '#e8a05a' : '#7fb4e8'); g.fillRect(P[i + 1] * s, P[i + 2] * s, 4, 4); } requestAnimationFrame(draw); }
draw();
cv.onclick = (e) => { const r = cv.getBoundingClientRect(), s = Math.min(r.width / 120, r.height / 90), P = store.state.people; let best = null, bd = 400; for (let i = 0; i < P.length; i += 6) { const d = (P[i + 1] * s - (e.clientX - r.left)) ** 2 + (P[i + 2] * s - (e.clientY - r.top)) ** 2; if (d < bd) { bd = d; best = P[i]; } } if (best != null) store.select(best); };
store.setSpeed(qs.get('speed') || 'life');
</script></body></html>
