<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0e1319">
<title>Larkfield</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ui/app.css">
<link rel="stylesheet" href="ui/play/play.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="brand"><i class="logo"></i><b>Larkfield</b></div>
    <div id="clock"><span id="date">&nbsp;</span><span id="time"></span><span id="wx"></span></div>
    <div id="counts"><span id="popcount" title="Residents in the neighbourhood"></span><span id="citycount" title="Residents currently away in the city (via the station and bus stops)"></span></div>
    <button id="pausebtn" aria-label="Pause or resume"><span class="pi">&#10074;&#10074;</span></button>
    <button id="speedbtn" aria-label="Speed" aria-expanded="false"><span id="speedlbl">Scene</span> <i>&#9662;</i></button>
    <div id="speedpop">
      <div id="speedmeta"></div>
      <div id="speed" role="group" aria-label="Simulation speed"></div>
    </div>
    <button id="jump" title="Run until something notable happens (N)">Next event <i>&#9197;</i></button>
  </header>
  <main id="layout">
    <section id="map-wrap">
      <canvas id="map" aria-label="Map of Larkfield"></canvas>
      <div id="ticker" hidden></div>
      <div id="hud">
        <button id="z-in" aria-label="Zoom in">+</button>
        <button id="z-out" aria-label="Zoom out">&minus;</button>
        <button id="z-fit" aria-label="Fit map" title="Fit (0)">&#8962;</button>
        <button id="z-play" aria-label="Play as a resident" title="Play as a resident">&#9654;</button>
        <button id="z-next" aria-label="Skip to the next notable event" title="Next notable event (N)">&#9197;</button>
        <button id="z-follow" aria-label="Follow selected person" title="Follow their life (F)" hidden>&#9678;</button>
        <button id="z-lens" aria-label="Map overlay" title="Overlay">&#9681;</button>
      </div>
      <div id="speedinfo"></div>
      <div id="map-hint">drag to pan &middot; scroll or pinch to zoom &middot; tap a person or a building</div>
      <div id="loading"><div class="spin"></div><span>Waking Larkfield&hellip;</span></div>
    </section>
    <aside id="sidebar">
      <div id="grab" aria-hidden="true"><i></i></div>
      <nav id="tabs" role="tablist"></nav>
      <div id="panes"></div>
    </aside>
  </main>
</div>
<div id="toast" hidden></div>
<script type="module" src="ui/app.js"></script>
</body>
</html>
