<title>Agent Chat Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: run list in a left rail (select on phones), transcript centred, transport bar pinned to the bottom. */
:root {
  --bg: #eceff3;
  --surface: #f9fafb;
  --fg: #1a2130;
  --muted: #586274;
  --line: #d3d9e2;
  --accent: #1d4ed8;
  --on-accent: #ffffff;
  --hover: #e1e6ed;
  --on-agent: #ffffff;
  --a: #2f5ee0; --a-soft: #e2eafc;
  --b: #b45309; --b-soft: #fbebd6;
  --c: #0e7a6b; --c-soft: #d9f0ec;
  --d: #b02f68; --d-soft: #f8e0ea;
  --e: #6d45c9; --e-soft: #e9e2f8;
  --f: #5b7410; --f-soft: #e6eed0;
  --g: #c0392b; --g-soft: #f9e0dc;
  --h: #0b78a0; --h-soft: #d8eef6;
  --font-body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bar-h: 4.5rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e121a; --surface: #161b25; --fg: #e5e8ee; --muted: #98a2b4; --line: #293141;
    --accent: #7ea2ff; --on-accent: #0e121a; --hover: #202738; --on-agent: #0e121a;
    --a: #7ea2ff; --a-soft: #1a2542;
    --b: #f1a653; --b-soft: #382813;
    --c: #4fd0bb; --c-soft: #12322e;
    --d: #f278ae; --d-soft: #3a1a2b;
    --e: #b69bff; --e-soft: #2a2145;
    --f: #b3d452; --f-soft: #2a3210;
    --g: #ff8c7a; --g-soft: #3d1c18;
    --h: #5cc6ec; --h-soft: #10303c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e121a; --surface: #161b25; --fg: #e5e8ee; --muted: #98a2b4; --line: #293141;
  --accent: #7ea2ff; --on-accent: #0e121a; --hover: #202738; --on-agent: #0e121a;
  --a: #7ea2ff; --a-soft: #1a2542;
  --b: #f1a653; --b-soft: #382813;
  --c: #4fd0bb; --c-soft: #12322e;
  --d: #f278ae; --d-soft: #3a1a2b;
  --e: #b69bff; --e-soft: #2a2145;
  --f: #b3d452; --f-soft: #2a3210;
  --g: #ff8c7a; --g-soft: #3d1c18;
  --h: #5cc6ec; --h-soft: #10303c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 1.25rem 0; max-width: 78rem; margin: 0 auto; }
.top { display: flex; align-items: baseline; gap: .75rem 1.25rem; flex-wrap: wrap; margin-bottom: 1rem; }
h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; margin: 0; }
.sub { color: var(--muted); font-size: .85rem; font-family: var(--font-mono); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.25rem; }
.rail { display: none; min-width: 0; }
.selrow { display: flex; gap: .5rem; margin-bottom: 1rem; }
.picker-select { display: block; flex: 1; min-width: 0; width: 100%; padding: .6rem .7rem; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; font-size: .9rem; }
.main { min-width: 0; }
@media (min-width: 900px) {
  .layout { grid-template-columns: 17.5rem minmax(0, 1fr); gap: 2rem; }
  .rail { display: block; position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; max-height: calc(100vh - 2rem); overflow-y: auto; }
  .selrow { display: none; }
}
.label { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.runs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.run { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-left: 3px solid transparent; padding: .55rem .7rem; cursor: pointer; border-radius: 0 4px 4px 0; }
.runs li { position: relative; }
.run-x { position: absolute; top: .3rem; right: .3rem; width: 1.6rem; height: 1.6rem; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); border-radius: 4px; cursor: pointer; font-size: 1rem; line-height: 1; opacity: 0; }
.runs li:hover .run-x, .run-x:focus-visible { opacity: 1; }
.run-x:hover { background: var(--hover); color: var(--fg); }
@media (hover: none) { .run-x { opacity: .7; } }
.run-l1 { padding-right: 1.6rem; }
.cleared { color: var(--muted); font-size: .9rem; margin: 1rem 0; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
.run:hover { background: var(--hover); }
.run[aria-current="true"] { background: var(--surface); border-left-color: var(--accent); }
.run-l1 { display: flex; justify-content: space-between; gap: .5rem; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.run-l2, .run-l3 { display: block; }
.run-l2 { font-size: .9rem; font-weight: 500; overflow-wrap: anywhere; }
.run-l3 { font-size: .75rem; color: var(--muted); }

.info { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: .8rem 1rem; display: grid; gap: .5rem; margin-bottom: 1.5rem; font-size: .9rem; }
.info p { margin: 0; overflow-wrap: anywhere; }
.info .meta { display: flex; flex-wrap: wrap; gap: .25rem 1rem; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.info b { font-weight: 600; color: var(--fg); }
.info .label { margin-right: .5rem; }

.newrun { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .75rem; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: .8rem .9rem; margin-bottom: 1.25rem; }
.field { display: grid; gap: .3rem; min-width: 0; }
.field.grow { flex: 1 1 16rem; }
.field input, .field select { width: 100%; min-width: 0; min-height: 2.25rem; padding: .35rem .6rem; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; font-size: .9rem; }
.field.full { flex: 1 1 100%; }
.field textarea { width: 100%; min-width: 0; padding: .35rem .6rem; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; font-size: .9rem; resize: vertical; }
.newrun .status { flex: 1 1 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.status { margin: 0; font-size: .85rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.status.err { color: var(--d); }
.chat { display: flex; flex-direction: column; gap: 1rem; min-height: 12rem; }
.time { font-weight: 400; letter-spacing: 0; color: var(--muted); margin-left: .4rem; }
.round { display: flex; align-items: center; gap: .75rem; font-family: var(--font-mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: .5rem; }
.round::before, .round::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.msg { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: .65rem; max-width: 46rem; }
.avatar { width: 2rem; height: 2rem; border-radius: 4px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: .9rem; background: var(--who); color: var(--on-agent); }
.bubble { min-width: 0; background: var(--who-soft); border: 1px solid var(--line); border-radius: 2px 10px 10px 10px; padding: .6rem .85rem; overflow-wrap: anywhere; }
.name { font-family: var(--font-mono); font-size: .7rem; font-weight: 600; letter-spacing: .06em; color: var(--who); margin-bottom: .15rem; }
.bubble p { margin: 0 0 .6em; }
.bubble p:last-child, .bubble ul:last-child, .bubble ol:last-child, .bubble blockquote:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 0 0 .6em; padding-left: 1.3rem; }
.bubble li { margin-bottom: .2em; }
.bubble blockquote { margin: 0 0 .6em; padding-left: .8rem; border-left: 2px solid var(--who); color: var(--muted); }
.bubble hr { border: 0; border-top: 1px solid var(--line); margin: .6rem 0; }
.bubble code { font-family: var(--font-mono); font-size: .85em; background: var(--hover); padding: .05em .3em; border-radius: 3px; }
.bubble .h { font-weight: 700; }
.who-A { --who: var(--a); --who-soft: var(--a-soft); }
.who-B { --who: var(--b); --who-soft: var(--b-soft); }
.who-C { --who: var(--c); --who-soft: var(--c-soft); }
.who-D { --who: var(--d); --who-soft: var(--d-soft); }
.who-E { --who: var(--e); --who-soft: var(--e-soft); }
.who-F { --who: var(--f); --who-soft: var(--f-soft); }
.who-G { --who: var(--g); --who-soft: var(--g-soft); }
.who-H { --who: var(--h); --who-soft: var(--h-soft); }
.who-O { --who: var(--muted); --who-soft: var(--surface); }
.oracle { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: .5rem .85rem; font-size: .9rem; color: var(--muted); overflow-wrap: anywhere; }
.oracle .name { color: var(--muted); }
.oracle p { margin: 0 0 .5em; } .oracle p:last-child { margin-bottom: 0; }
.bubble a, .oracle a { color: var(--accent); }
.check { display: inline-flex; align-items: center; gap: .4rem; min-height: 2.25rem; font-size: .9rem; cursor: pointer; }
.check input { accent-color: var(--accent); width: 1rem; height: 1rem; }
.quiet { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); padding-left: 2.65rem; }
.quiet b { color: var(--who); font-weight: 600; }
.new { animation: arrive .25s ease-out; }
@keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.typing .bubble { display: flex; gap: 5px; align-items: center; padding-block: .85rem; }
.typing .bubble i { width: 6px; height: 6px; border-radius: 50%; background: var(--who); opacity: .5; animation: blink 1s infinite; }
.typing .bubble i:nth-child(2) { animation-delay: .15s; }
.typing .bubble i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
.end { text-align: center; border: 1px dashed var(--line); border-radius: 4px; padding: .8rem 1rem; color: var(--muted); font-size: .9rem; margin-top: .5rem; }
.end b { color: var(--fg); font-weight: 600; }
.empty { color: var(--muted); font-style: italic; }
.error { background: var(--surface); border: 1px solid var(--d); border-radius: 4px; padding: 1rem; margin: 1rem 0; }
.error p { margin: .3rem 0 0; color: var(--muted); }
#tail { height: 1px; scroll-margin-bottom: calc(var(--bar-h) + 1.5rem); }

.bar-outer { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); margin-top: 1.5rem; padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar { max-width: 78rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: .6rem; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; }
.group { display: flex; gap: .35rem; align-items: center; min-width: 0; }
.btn { white-space: nowrap; display: inline-flex; align-items: center; gap: .35rem; min-height: 2.25rem; padding: 0 .75rem; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; cursor: pointer; font-size: .85rem; font-weight: 500; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); min-width: 5.5rem; justify-content: center; font-weight: 600; }
.btn svg { width: 14px; height: 14px; fill: currentColor; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); min-height: 2.25rem; padding: 0 .55rem; cursor: pointer; font-family: var(--font-mono); font-size: .75rem; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--hover); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.count { margin-left: auto; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .count { margin-left: 0; } .btn { padding: 0 .5rem; } .group:first-child { flex-wrap: wrap; } }
@media (prefers-reduced-motion: reduce) { .new, .typing .bubble i { animation: none; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Agent Chat Viewer</h1>
    <span class="sub" id="summary"></span>
  </header>
  <div id="error" class="error" role="alert" hidden></div>
  <form class="newrun" id="newForm" autocomplete="off" hidden>
    <div class="field grow"><label class="label" for="nTopic">Topic</label>
      <input id="nTopic" type="text" maxlength="500" placeholder="Optional"></div>
    <div class="field"><label class="label" for="nModel">Model</label>
      <select id="nModel"><option value="haiku" selected>haiku</option><option value="sonnet">sonnet</option></select></div>
    <div class="field"><label class="label" for="nPeople">People</label>
      <select id="nPeople"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
    <label class="check" for="nOracle"><input id="nOracle" type="checkbox"> Oracle</label>
    <div class="field full"><label class="label" for="nSecrets">Secrets (optional)</label>
      <textarea id="nSecrets" rows="2" placeholder="Optional, one per line: Tom: ..."></textarea></div>
    <button class="btn primary" id="nGo" type="submit" disabled>Start</button>
    <p class="status" id="nStatus" role="status"></p>
  </form>
  <p class="cleared" id="cleared" hidden>All runs cleared. <button class="linkbtn" id="showAll" type="button">Show all again</button></p>
  <div class="layout" id="layout" hidden>
    <aside class="rail" aria-label="Runs">
      <ul class="runs" id="runs"></ul>
    </aside>
    <main class="main">
      <label class="label" for="runSelect" hidden>Run</label>
      <div class="selrow"><select class="picker-select" id="runSelect"></select><button class="btn" id="selRemove" type="button">Remove</button></div>
      <section class="info" id="info" aria-label="Run details"></section>
      <div class="chat" id="chat" aria-live="off"></div>
      <div id="tail"></div>
    </main>
  </div>
</div>

<div class="bar-outer" id="barOuter" hidden>
  <div class="bar" role="group" aria-label="Playback">
    <div class="group">
      <button class="btn" id="back" type="button" title="Step back"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2h2v10H2zM13 2v10L5 7z"/></svg>Back</button>
      <button class="btn primary" id="play" type="button"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z"/></svg><span>Play</span></button>
      <button class="btn" id="fwd" type="button" title="Step forward">Next<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M12 2h-2v10h2zM1 2v10l8-5z"/></svg></button>
      <button class="btn" id="all" type="button">Show all</button>
    </div>
    <div class="group">
      <div class="seg" role="group" aria-label="Speed" id="speeds"></div>
    </div>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const SPEEDS = [0.5, 1, 2, 4];
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  // Markdown: input is escaped first, so only tags generated here can reach the DOM.
  function inline(s) {
    return s.split(/(`[^`]+`)/).map((p, i) => {
      if (i % 2) return '<code>' + p.slice(1, -1) + '</code>';
      return p.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^\w*])\*([^\s*][^*]*?)\*(?![\w*])/g, '$1<em>$2</em>')
        .replace(/(^|[^\w])_([^\s_][^_]*?)_(?!\w)/g, '$1<em>$2</em>');
    }).join('');
  }
  function md(src) {
    const out = []; let para = [], list = null, quote = [];
    const fp = () => { if (para.length) out.push('<p>' + inline(para.join('<br>')) + '</p>'); para = []; };
    const fl = () => { if (list) out.push('<' + list.t + '>' + list.items.map(x => '<li>' + inline(x) + '</li>').join('') + '</' + list.t + '>'); list = null; };
    const fq = () => { if (quote.length) out.push('<blockquote>' + inline(quote.join('<br>')) + '</blockquote>'); quote = []; };
    const flush = () => { fp(); fl(); fq(); };
    for (const line of esc(src).split('\n')) {
      let m;
      if (!line.trim()) flush();
      else if ((m = line.match(/^\s*(?:-{3,}|\*{3,})\s*$/))) { flush(); out.push('<hr>'); }
      else if ((m = line.match(/^#{1,4}\s+(.*)$/))) { flush(); out.push('<p class="h">' + inline(m[1]) + '</p>'); }
      else if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) { fp(); fq(); if (!list || list.t !== 'ul') { fl(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { fp(); fq(); if (!list || list.t !== 'ol') { fl(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); }
      else if ((m = line.match(/^&gt;\s?(.*)$/))) { fp(); fl(); quote.push(m[1]); }
      else if (list && /^\s+\S/.test(line)) list.items[list.items.length - 1] += '<br>' + line.trim();
      else { fl(); fq(); para.push(line); }
    }
    flush();
    return out.join('');
  }

  const fmtDate = iso => {
    try { return new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(iso)); }
    catch (e) { return iso; }
  };
  const cls = w => run.names.includes(w) ? 'who-' + 'ABCDEFGH'[run.names.indexOf(w)] : 'who-O'; // colour by slot in run.names
  const nonPass = r => r.turns.filter(t => !t.pass && !t.clock).length;
  const endLabel = r => r.ended === 'everyone passed' ? 'everyone passed' : 'round limit';

  let allRuns = [], runs = [], run = null, pos = 0, playing = false, typing = null, timer = null;
  let speed = +store.get('chatSpeed') || 1; if (!SPEEDS.includes(speed)) speed = 1;
  const vis = () => true;

  function showError(msg) {
    const e = $('error');
    e.hidden = false;
    e.innerHTML = '<strong>Could not load the conversations.</strong><p>' + esc(msg) + ' Run <code>node viewer/build.mjs</code> from open-chat/ to create runs.json, and open this page over http from the same folder.</p>';
  }

  let hidden = [];
  try { const h = JSON.parse(store.get('chatHidden') || '[]'); if (Array.isArray(h)) hidden = h; } catch (e) {}
  // Recompute the visible list; if the shown run is gone, switch to the newest remaining.
  function applyHidden(initial) {
    store.set('chatHidden', JSON.stringify(hidden));
    runs = allRuns.filter(r => !hidden.includes(r.id));
    $('cleared').hidden = runs.length > 0;
    $('layout').hidden = $('barOuter').hidden = !runs.length;
    if (runs.length) { if (!run || !runs.includes(run)) selectRun(runs[0].id, initial); else renderPicker(); }
    else { stop(); run = null; }
  }
  function hideRun(id) { if (!hidden.includes(id)) hidden.push(id); applyHidden(); }
  function renderPicker() {
    $('runs').innerHTML = runs.map(r => `<li><button class="run" type="button" data-id="${esc(r.id)}" aria-current="${r === run}">
      <span class="run-l1"><span>${esc(fmtDate(r.started))}</span><span>${esc(r.model)}</span></span>
      <span class="run-l2">${r.topic ? esc(r.topic) : 'Open conversation'}</span>
      <span class="run-l3">${nonPass(r)} messages</span></button>
      <button class="run-x" type="button" data-x="${esc(r.id)}" aria-label="Remove ${esc(fmtDate(r.started))} ${r.topic ? esc(r.topic.slice(0, 40)) : 'open conversation'} from list">\u00d7</button></li>`).join('');
    $('runSelect').innerHTML = runs.map(r => `<option value="${esc(r.id)}"${r === run ? ' selected' : ''}>${esc(fmtDate(r.started))} \u00b7 ${esc(r.model)} \u00b7 ${r.topic ? esc(r.topic.slice(0, 40)) : 'open'}</option>`).join('');
  }

  function renderInfo() {
    $('info').innerHTML = `<div class="meta"><span><b>${esc(run.model)}</b></span><span>${esc(fmtDate(run.started))}</span></div>
      <p><span class="label">Topic</span>${run.topic ? esc(run.topic) : 'none'}</p>${Object.entries(run.secrets || {}).map(([w, t]) => `<p class="${cls(w)}" style="color:var(--who)"><span class="label" style="color:inherit">${esc(w)}'s secret</span>${esc(t)}</p>`).join('')}`;
  }

  function render(animateLast, follow) {
    const turns = run.turns; let html = '';
    for (let i = 0; i < pos; i++) {
      const t = turns[i]; if (!vis(t)) continue;
      const tm = t.at ? `<span class="time">${esc(t.at.slice(11, 16))}</span>` : '';
      if (t.clock) html += `<div class="round">${esc((t.text.match(/It's now (.+?)\.\)/) || [0, t.text])[1])}</div>`;
      else if (t.oracle) html += `<div class="oracle${animateLast && i === pos - 1 ? ' new' : ''}"><div class="name">Oracle${tm}</div>${md(t.text)}</div>`;
      else if (t.pass) html += `<div class="quiet ${cls(t.who)}"><b>${esc(t.who)}</b> stayed quiet</div>`;
      else { html += `<div class="msg ${cls(t.who)}${animateLast && i === pos - 1 ? ' new' : ''}"><div class="avatar" aria-hidden="true">${esc(t.who[0])}</div><div class="bubble"><div class="name">${esc(t.who)}${tm}</div>${md(t.text)}</div></div>`; }
    }
    if (typing) {
      html += `<div class="msg typing ${cls(typing.who)}" aria-label="${esc(typing.who)} is typing"><div class="avatar" aria-hidden="true">${esc(typing.who[0])}</div><div class="bubble"><i></i><i></i><i></i></div></div>`;
    }
    if (pos >= turns.length) {
      html += run.ended === 'everyone passed' ? '<div class="end">End</div>' : '<div class="end">Cut off</div>';
    }
    $('chat').innerHTML = html;
    const shown = turns.slice(0, pos).filter(t => !t.pass && !t.clock).length, total = nonPass(run);
    $('count').textContent = `${shown} / ${total} messages`;
    $('play').querySelector('span').textContent = playing ? 'Pause' : (pos >= turns.length ? 'Replay' : 'Play');
    $('play').querySelector('svg').innerHTML = playing ? '<path d="M2 1.5h3.5v11H2zM8.5 1.5H12v11H8.5z"/>' : '<path d="M3 1.5v11l9-5.5z"/>';
    $('back').disabled = pos <= 0; $('fwd').disabled = pos >= turns.length;
    if (follow) $('tail').scrollIntoView({ block: 'end', behavior: reduced() ? 'auto' : 'smooth' });
  }

  const nextIdx = from => { for (let j = from; j < run.turns.length; j++) if (vis(run.turns[j])) return j; return -1; };
  function stop() { playing = false; typing = null; clearTimeout(timer); timer = null; }

  function tick() {
    if (!playing) return;
    const j = nextIdx(pos);
    if (j < 0) { pos = run.turns.length; stop(); render(false, true); return; }
    const t = run.turns[j], len = t.text.length;
    pos = j; // reveal silently any hidden passes before j
    const typeMs = reduced() ? 0 : (t.pass || t.clock ? 500 : 500 + Math.min(len, 500) * 3.5) / speed;
    typing = reduced() || t.clock ? null : { who: t.who };
    render(false, true);
    timer = setTimeout(() => {
      typing = null; pos = j + 1; render(true, true);
      timer = setTimeout(tick, (t.pass ? 600 : 700 + Math.min(len, 900) * 4) / speed);
    }, typeMs);
  }
  function play() { if (pos >= run.turns.length) pos = 0; playing = true; tick(); }
  function pause() { stop(); render(false, false); }

  function step(dir) {
    stop();
    if (dir > 0) { const j = nextIdx(pos); pos = j < 0 ? run.turns.length : j + 1; render(true, true); }
    else { let k = pos - 1; while (k >= 0 && !vis(run.turns[k])) k--; pos = Math.max(k, 0); render(false, false); }
  }

  function selectRun(id, initial) {
    run = runs.find(r => r.id === id) || runs[0];
    stop(); store.set('chatRun', run.id);
    pos = run.turns.length;
    renderPicker(); renderInfo(); render(false, false);
    if (!initial) window.scrollTo({ top: 0 });
  }

  function init() {
    $('speeds').innerHTML = SPEEDS.map(s => `<button type="button" data-s="${s}" aria-pressed="${s === speed}">${s}x</button>`).join('');
    $('runs').addEventListener('click', e => {
      const x = e.target.closest('.run-x'); if (x) { hideRun(x.dataset.x); return; }
      const b = e.target.closest('.run'); if (b) selectRun(b.dataset.id);
    });
    $('selRemove').addEventListener('click', () => hideRun($('runSelect').value));
    $('showAll').addEventListener('click', () => { hidden = []; applyHidden(true); });
    $('runSelect').addEventListener('change', e => selectRun(e.target.value));
    $('play').addEventListener('click', () => playing ? pause() : play());
    $('fwd').addEventListener('click', () => step(1));
    $('back').addEventListener('click', () => step(-1));
    $('all').addEventListener('click', () => { stop(); pos = run.turns.length; render(false, true); });
    $('speeds').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      speed = +b.dataset.s; store.set('chatSpeed', speed);
      for (const x of $('speeds').children) x.setAttribute('aria-pressed', String(x === b));
    });
  }

  // New conversation: the request goes to Claude as a comment; Claude runs it and republishes.
  let comments = null, sending = false, canSend = false, sentNote = false;
  const nStatus = (msg, err) => { $('nStatus').textContent = msg; $('nStatus').classList.toggle('err', !!err); };
  async function checkSend() {
    let why = "Starting runs isn't available in this view.";
    canSend = false;
    try {
      if (comments) {
        const c = await comments.canSendToClaude();
        if (c === 'available') canSend = true;
        else if (c === 'writers_only') why = 'Only editors can start runs.';
        else if (c === 'no_session') why = 'No Claude session is listening right now.';
      }
    } catch (e) {}
    $('nGo').disabled = !canSend || sending;
    if (!sending && !sentNote) nStatus(canSend ? '' : why);
  }
  async function initNew() {
    try { comments = window.claude && window.claude.use ? await window.claude.use('comments') : null; } catch (e) { comments = null; }
    $('newForm').hidden = false;
    $('newForm').addEventListener('focusin', () => { if (!sending) { sentNote = false; checkSend(); } });
    await checkSend();
    $('newForm').addEventListener('submit', async e => {
      e.preventDefault();
      if (!comments || !canSend || sending) return;
      const topic = $('nTopic').value.replace(/\s+/g, ' ').trim().slice(0, 500);
      const people = Math.min(8, Math.max(2, +$('nPeople').value || 4));
      const pool = ['Maya', 'Tom', 'Jo', 'Sam', 'Priya', 'Dan', 'Ellie', 'Kofi'].slice(0, people), secrets = {};
      for (const line of $('nSecrets').value.split('\n')) {
        if (!line.trim()) continue;
        const m = line.match(/^\s*([^:]+?)\s*:\s*(.+?)\s*$/), name = m && pool.find(n => n.toLowerCase() === m[1].toLowerCase());
        if (!name) { nStatus(`Secrets: use "Name: secret", with a name from the first ${people} people (${pool.join(', ')}).`, true); return; }
        secrets[name] = m[2].replace(/\s+/g, ' ').slice(0, 300);
      }
      const model = $('nModel').value === 'sonnet' ? 'sonnet' : 'haiku';
      const text = `START RUN\nmodel: ${model}\npeople: ${people}\nmessages: 120\noracle: ${$('nOracle').checked ? 'yes' : 'no'}\ntopic: ${topic || '(none)'}\nsecrets: ${JSON.stringify(secrets)}`;
      sending = true; $('nGo').disabled = true; nStatus('Sending\u2026');
      try {
        const anchor = await comments.anchorFor($('newForm'));
        await comments.sendToClaude({ anchor, text });
        sentNote = true;
        nStatus('Sent');
      } catch (err) {
        const code = err && err.code;
        nStatus(code === 'consent_required' ? 'Not sent. Allow comments for this page to start runs, then try again.'
          : code === 'rate_limited' ? 'Not sent. Too many requests; wait a moment and try again.'
          : code === 'claude_unavailable' ? 'Not sent. Claude is not available right now.'
          : 'Not sent. Something went wrong; try again.', true);
      }
      sending = false; $('nGo').disabled = !canSend;
    });
  }
  initNew();

  fetch('runs.json').then(r => { if (!r.ok) throw new Error('runs.json returned HTTP ' + r.status + '.'); return r.json(); })
    .then(data => {
      if (!Array.isArray(data) || !data.length) throw new Error('runs.json has no conversations.');
      allRuns = data;
      init();
      applyHidden(true);
    })
    .catch(err => showError(err && err.message ? err.message : 'The request failed.'));
})();
</script>
